name               = "stellarglobalsupplies-workflows"
main               = "src/api-router.js"
compatibility_date = "2025-04-01"
workers_dev        = true

[observability.logs]
enabled         = true
invocation_logs = true

[triggers]
crons = []

# Workers AI binding — FLUX image generation (10k free Neurons/day)
[ai]
binding = "AI"

[[d1_databases]]
binding       = "DB"
database_name = "stellar-workflows"
database_id   = "76d6801a-7091-4036-b7a0-935ca9b56641"

[[secrets_store_secrets]]
binding     = "SUPABASE_URL"
secret_name = "SUPABASE_URL"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "SUPABASE_SERVICE_KEY"
secret_name = "SUPABASE_SERVICE_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "BEDROCK_ACCESS_KEY_ID"
secret_name = "BEDROCK_ACCESS_KEY_ID"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "BEDROCK_SECRET_ACCESS_KEY"
secret_name = "BEDROCK_SECRET_ACCESS_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "BEDROCK_REGION"
secret_name = "BEDROCK_REGION"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"