name               = "stellar-schedule-runner"
main               = "../workers/src/schedule-runner.js"
compatibility_date = "2025-04-01"

[observability.logs]
enabled         = true
invocation_logs = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding       = "DB"
database_name = "stellar-workflows"
database_id   = "76d6801a-7091-4036-b7a0-935ca9b56641"

[[secrets_store_secrets]]
binding     = "SUPABASE_URL"
secret_name = "SUPABASE_URL"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "SUPABASE_SERVICE_KEY"
secret_name = "SUPABASE_SERVICE_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"