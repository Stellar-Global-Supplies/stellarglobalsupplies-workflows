name               = "s3-cleanup"
main               = "index.js"
compatibility_date = "2025-04-01"

# Enable Node.js compat (for any Node built-ins if needed)
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled         = true
invocation_logs = true

# ── Secrets (via Cloudflare Secrets Store — same pattern as other workers) ─
# Uses the SAME bedrock_* secrets as the main worker for AWS access.
[[secrets_store_secrets]]
binding     = "BEDROCK_ACCESS_KEY_ID"
secret_name = "BEDROCK_ACCESS_KEY_ID"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "BEDROCK_SECRET_ACCESS_KEY"
secret_name = "BEDROCK_SECRET_ACCESS_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "BEDROCK_REGION"
secret_name = "BEDROCK_REGION"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"

[[secrets_store_secrets]]
binding     = "NEW_RELIC_LICENSE_KEY"
secret_name = "NEW_RELIC_LICENSE_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
