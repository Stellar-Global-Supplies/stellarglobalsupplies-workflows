name               = "stellar-job-runner"
main               = "../workers/src/job-runner.js"
compatibility_date = "2025-04-01"

[observability.logs]
enabled         = true
invocation_logs = true

[triggers]
crons = ["* * * * *"]

# ── Service Bindings — direct worker-to-worker calls (no HTTP, no DNS, no 1042 errors) ──
# These replace the old CUR_FORWARDER_URL / POSTGRES_FORWARDER_URL / AI_SYNC_URL vars.
[[services]]
binding  = "SVC_CUR_FORWARDER"
service  = "cur-forwarder"

[[services]]
binding  = "SVC_POSTGRES_FORWARDER"
service  = "postgres-forwarder"

[[services]]
binding  = "SVC_AI_SYNC"
service  = "ai-sync"

[[services]]
binding  = "SVC_S3_CLEANUP"
service  = "s3-cleanup"

# Workers AI binding — FLUX image generation
[ai]
binding = "AI"

[[d1_databases]]
binding       = "DB"
database_name = "stellar-workflows"
database_id   = "76d6801a-7091-4036-b7a0-935ca9b56641"

